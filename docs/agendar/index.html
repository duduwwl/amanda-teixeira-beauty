<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar — Amanda Teixeira Beauty</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet"><link rel="stylesheet" href="../styles.css"></head><body><main class="page"><a class="back" href="../">← Voltar</a><p class="eyebrow">Agendamento</p><h1>Vamos cuidar<br>de você.</h1><div class="page-grid"><div><p>Preencha as informações para preparar sua solicitação. Ao continuar, você será direcionada ao WhatsApp da Amanda para confirmar disponibilidade, valor e horário.</p></div><form class="booking-form" id="booking"><label>Procedimento<select name="servico" required><option value="">Selecione</option><option>Regeneração capilar</option><option>Regeneração de sobrancelhas</option><option>Micropigmentação</option><option>Remoção a laser</option><option>Curso profissional</option></select></label><label>Data de preferência<input type="date" name="data" required></label><label>Período<select name="periodo" required><option value="">Selecione</option><option>Manhã</option><option>Tarde</option><option>Sem preferência</option></select></label><label>Seu nome<input name="nome" autocomplete="name" required></label><label>Telefone<input name="telefone" type="tel" autocomplete="tel" required></label><label>Observação<textarea name="observacao" placeholder="Conte brevemente o que você procura"></textarea></label><p class="form-note">O envio abre o WhatsApp. O agendamento só fica confirmado após a resposta da equipe.</p><button type="submit">Continuar no WhatsApp ↗</button></form></div></main><script>const p=new URLSearchParams(location.search).get('servico');if(p)document.querySelector('[name=servico]').value=p;document.querySelector('[name=data]').min=new Date().toISOString().slice(0,10);document.querySelector('#booking').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.currentTarget);const msg=`Olá, Amanda! Gostaria de solicitar um horário.\n\nNome: ${d.get('nome')}\nProcedimento: ${d.get('servico')}\nData: ${d.get('data')}\nPeríodo: ${d.get('periodo')}\nTelefone: ${d.get('telefone')}\nObservação: ${d.get('observacao')||'—'}`;location.href='https://wa.me/message/AJAAIV6XAB5NF1?text='+encodeURIComponent(msg)});</script></body></html>
